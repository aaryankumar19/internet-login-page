<!DOCTYPE html>
<html>
<head>
  <title>Manage Accounts</title>
  <script src="popupmain.js" defer></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      width: 280px;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #212529;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 18px;
      color: #343a40;
      text-align: center;
    }

    h3 {
      margin: 0 0 4px;
      font-size: 14px;
      color: #343a40;
    }

    input {
      margin-top: 8px;
      padding: 8px 10px;
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
      font-family: Arial, sans-serif;
    }

    button {
      margin-top: 8px;
      padding: 8px 10px;
      width: 100%;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-family: Arial, sans-serif;
    }

    button:hover { background-color: #0056b3; }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 8px 10px;
      margin-top: 8px;
    }

    .row .id {
      font-weight: bold;
      font-size: 13px;
      color: #212529;
    }

    .row .actions { display: flex; gap: 6px; }

    .row button {
      width: auto;
      margin: 0;
      padding: 5px 8px;
      font-size: 11px;
      border-radius: 4px;
    }

    .btn-default { background: #ffc107; color: #212529; }
    .btn-default:hover { background: #e0a800; }
    .btn-del { background: #6c757d; }
    .btn-del:hover { background: #5a6268; }

    .badge {
      background: #28a745;
      color: #fff;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      margin-left: 6px;
    }

    hr {
      border: none;
      border-top: 1px solid #dee2e6;
      margin: 14px 0;
    }

    #empty {
      text-align: center;
      color: #868e96;
      font-size: 13px;
      padding: 10px 0;
    }

    #status {
      color: #28a745;
      margin-top: 10px;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>Manage Accounts</h2>

  <div id="empty" style="display: none;">No accounts saved yet.</div>
  <div id="account-list"></div>

  <hr>

  <h3>Add Account</h3>
  <input type="number" id="reg_id" placeholder="Registration Number" />
  <input type="password" id="pwd" placeholder="Password" />
  <button id="saveBtn">Add Account</button>

  <p id="status"></p>
</body>
</html>
